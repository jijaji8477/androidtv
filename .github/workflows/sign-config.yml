# Lives in the GitHub repo as .github/workflows/sign-config.yml.
# Edit config.json on github.com (browser or the GitHub app) and commit: this checks the JSON,
# signs it with the key in the CONFIG_SIGNING_KEY secret, commits config.json.sig and
# refreshes jsDelivr, so the app picks the change up. No PC needed.
name: Sign config

on:
  push:
    branches: [main]
    paths: [config.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sign-config
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check config.json is valid JSON
        run: python3 -m json.tool config.json > /dev/null

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sign
        env:
          CONFIG_SIGNING_KEY: ${{ secrets.CONFIG_SIGNING_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$CONFIG_SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/keys/private.pk8"
          java tools/ConfigSigner.java sign "$RUNNER_TEMP/keys" config.json
          rm -rf "$RUNNER_TEMP/keys"

      - name: Commit signature
        run: |
          git config user.name "config-signer"
          git config user.email "config-signer@users.noreply.github.com"
          git add config.json.sig
          git diff --cached --quiet || git commit -m "Sign config.json"
          git push

      - name: Refresh jsDelivr
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/config.json" || true
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/config.json.sig" || true
